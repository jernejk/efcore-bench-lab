name: Build and Test

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore EfCoreBenchLab.slnx

      - name: Build
        run: dotnet build EfCoreBenchLab.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EfCoreBenchLab.slnx --configuration Release --no-build --verbosity normal
